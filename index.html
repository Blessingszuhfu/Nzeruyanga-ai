
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#11152d">
<title>Nzeruyanga AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101326;
  color: white;
  min-height: 100vh;
}

header {
  background: #1c2050;
  text-align: center;
  padding: 25px 15px;
  border-bottom: 1px solid #393b70;
}

header h1 {
  color: #ad98ff;
  margin: 0;
  font-size: 27px;
}

header p {
  color: #c5c8e8;
  margin-bottom: 0;
}

main {
  width: 100%;
  max-width: 700px;
  margin: 35px auto;
  padding: 15px;
}

.panel {
  background: #1d2240;
  padding: 22px;
  border-radius: 18px;
  border: 1px solid #34385e;
}

.panel h2 {
  color: #c0adff;
}

#answer {
  min-height: 90px;
  max-height: 420px;
  overflow-y: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.7;
  background: #11162c;
  padding: 15px;
  border-radius: 12px;
  margin-top: 20px;
  color: #eeeeff;
}

textarea {
  display: block;
  width: 100%;
  min-height: 115px;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #555b85;
  background: #11162c;
  color: white;
  font-size: 16px;
  resize: vertical;
}

textarea:focus {
  outline: 2px solid #8065ef;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 14px;
  border: none;
  border-radius: 11px;
  background: #8065ef;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

.note {
  color: #aeb2d0;
  font-size: 12px;
  text-align: center;
  margin-top: 20px;
}

footer {
  text-align: center;
  color: #9298bb;
  font-size: 12px;
  padding: 20px;
}
</style>
</head>

<body>

<header>
  <h1>NZERUYANGA AI</h1>
  <p>Intelligence Without Limits.</p>
</header>

<main>
  <div class="panel">
    <h2>Your AI Assistant</h2>

    <p>Welcome! How can I help you today?</p>

    <textarea
      id="question"
      placeholder="Ask Nzeruyanga AI anything..."
      aria-label="Your question"
    ></textarea>

    <button id="askButton" type="button">
      Ask AI
    </button>

    <div id="answer" aria-live="polite">
      Your AI answers will appear here.
    </div>

    <p class="note">
      Powered by Google Gemini.
    </p>
  </div>
</main>

<footer>
  © 2026 Nzeruyanga AI. All rights reserved.
</footer>

<script>
const questionBox = document.getElementById("question");
const answerBox = document.getElementById("answer");
const askButton = document.getElementById("askButton");

async function askAI() {
  const question = questionBox.value.trim();

  if (!question) {
    answerBox.textContent = "Please enter a question first.";
    questionBox.focus();
    return;
  }

  askButton.disabled = true;
  askButton.textContent = "Thinking...";
  answerBox.textContent = "Nzeruyanga AI is preparing your answer...";

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        question: question
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI connection failed.");
    }

    answerBox.textContent = data.answer ||
      "Sorry, no answer was generated.";

  } catch (error) {
    console.error("Nzeruyanga AI error:", error);

    answerBox.textContent =
      "Sorry, we could not connect to Nzeruyanga AI. " +
      "Please try again. If the problem continues, " +
      "check your internet connection or server settings.";

  } finally {
    askButton.disabled = false;
    askButton.textContent = "Ask AI";
  }
}

askButton.addEventListener("click", askAI);

questionBox.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    askAI();
  }
});
</script>

</body>
</html>
