
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nzeruyanga AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101326;
      color: white;
      min-height: 100vh;
    }
    header {
      padding: 22px;
      text-align: center;
      background: #1c2050;
    }
    header h1 { color: #a995ff; margin: 0; }
    header p { color: #c5c8e8; }
    main {
      max-width: 650px;
      margin: 45px auto;
      padding: 20px;
    }
    .panel {
      background: #1d2240;
      padding: 24px;
      border-radius: 16px;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #555b85;
      background: #11162c;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      background: #8065ef;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    #answer {
      margin-top: 20px;
      white-space: pre-wrap;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <h1>NZERUYANGA AI</h1>
    <p>Intelligence Without Limits</p>
  </header>
  <main>
    <div class="panel">
      <h2>Your AI Assistant</h2>
      <p>What would you like help with today?</p>
      <textarea id="question" placeholder="Ask Nzeruyanga AI anything..."></textarea>
      <button onclick="askAI()">Ask AI</button>
      <div id="answer">Your answers will appear here.</div>
    </div>
  </main>
  <script>
    
async function askAI() {
  const question = document.getElementById("question").value.trim();
  const answer = document.getElementById("answer");
  const button = document.querySelector("button");

  if (!question) {
    answer.textContent = "Please enter a question.";
    return;
  }

  button.disabled = true;
  button.textContent = "Thinking...";
  answer.textContent = "Nzeruyanga AI is thinking...";

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ question })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI connection failed.");
    }

    answer.textContent = data.answer;

  } catch (error) {
    answer.textContent = "Sorry, something went wrong. Please try again.";
  } finally {
    button.disabled = false;
    button.textContent = "Ask AI";
  }
}
